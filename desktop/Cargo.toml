[package]
name = "egword2epub-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Egword2EPUB のデスクトップ版（Mac・Windows・Linux）"

[[bin]]
name = "Egword2EPUB"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
